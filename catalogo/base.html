<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Biblioteca Escolar{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">📚 Biblioteca Escolar</span>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small">{{ user.username }}</span>
            <a href="/admin/" class="btn btn-outline-light btn-sm">Panel Admin</a>
            <a href="{% url 'catalogo:agregar_libro' %}" class="btn btn-warning btn-sm">+ Agregar libro</a>
        </div>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} alert-dismissible fade show">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}

    {% block contenido %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
