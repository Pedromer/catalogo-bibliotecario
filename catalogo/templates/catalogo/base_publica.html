{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Catálogo | Biblioteca ESET-UNQ{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'catalogo/css/publico.css' %}" rel="stylesheet">
</head>
<body>

<nav class="navbar-publica">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'catalogo:catalogo_publico' %}"
           class="text-white text-decoration-none fw-semibold" style="font-size: medium;">
            Biblioteca ESET-UNQ
        </a>
            <form method="get" action="{% url 'catalogo:catalogo_publico' %}" class="navbar-search-form">
            <input
                type="text"
                name="q"
                value="{{ query|default_if_none:'' }}"
                placeholder="Título, autor o ISBN..."
                class="form-control"
                aria-label="Buscar libros"
            >
        </form>
        <div class="d-flex gap-2 align-items-center">
            {% block navbar_actions %}{% endblock %}

            {% if user.is_authenticated %}
            <a href="{% url 'admin:index' %}" class="btn btn-outline-light btn-sm">Interno</a>
            {% endif %}

            <button class="btn btn-outline-light btn-sm d-flex align-items-center gap-2" type="button" id="toggle-filtros" aria-controls="sidebar-filtros" aria-expanded="false">
                <span>☰</span>
            </button>
        </div>
    </div>
</nav>

<div class="public-content py-4">
    {% block contenido %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
