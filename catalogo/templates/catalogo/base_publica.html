{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Catálogo | Biblioteca ESET-UNQ{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'catalogo/css/publico.css' %}" rel="stylesheet">
</head>
<body>

<nav class="navbar-publica">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'catalogo:catalogo_publico' %}"
           class="text-white text-decoration-none fw-semibold fs-5">
            Biblioteca ESET-UNQ
        </a>
        {% if user.is_authenticated %}
        <div class="d-flex gap-2">
            <a href="/admin/catalogo/libro/"
               class="btn btn-warning btn-sm">+ Agregar libro</a>
            <a href="/admin/" class="btn btn-outline-light btn-sm">Panel Admin</a>
        </div>
        {% else %}
        <a href="/admin/login/?next=/admin/"
           class="btn btn-outline-light btn-sm">Acceso bibliotecarios</a>
        {% endif %}
    </div>
</nav>

<div class="container py-4">
    {% block contenido %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
